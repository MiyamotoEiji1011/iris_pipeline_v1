<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Iris Pipeline - LED Test</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 480px;
      margin: 60px auto;
      padding: 0 20px;
      background: #f5f5f5;
    }
    h1 { font-size: 1.4rem; color: #333; }
    .card {
      background: white;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 4px; }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      font-size: 0.95rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #4a90d9;
      color: white;
    }
    button:hover { background: #357abd; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 4px;
      font-size: 0.95rem;
      text-align: center;
      display: none;
    }
    .status.on  { background: #d4edda; color: #155724; display: block; }
    .status.off { background: #f8d7da; color: #721c24; display: block; }
    .status.err { background: #fff3cd; color: #856404; display: block; }
    .led-indicator {
      width: 24px; height: 24px;
      border-radius: 50%;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
      background: #ccc;
    }
    .led-indicator.on  { background: #28a745; box-shadow: 0 0 8px #28a745; }
    .led-indicator.off { background: #dc3545; }
  </style>
</head>
<body>
  <h1>Iris Pipeline - API LED テスト</h1>
  <div class="card">
    <label for="pat">GitHub Personal Access Token</label>
    <input type="text" id="pat" placeholder="ghp_xxxxxxxxxxxx">

    <button id="toggleBtn" onclick="toggleLED()">API LED を切り替え</button>

    <div class="status" id="status">
      <span class="led-indicator" id="ledIcon"></span>
      <span id="statusText">-</span>
    </div>
  </div>

  <script>
    const OWNER  = 'MiyamotoEiji1011';
    const REPO   = 'iris_pipeline_v1';
    const PATH   = 'api/command.json';
    const API    = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;

    function setStatus(state) {
      const box  = document.getElementById('status');
      const icon = document.getElementById('ledIcon');
      const text = document.getElementById('statusText');
      if (state === 'on') {
        box.className  = 'status on';
        icon.className = 'led-indicator on';
        text.textContent = 'API LED: ON';
      } else if (state === 'off') {
        box.className  = 'status off';
        icon.className = 'led-indicator off';
        text.textContent = 'API LED: OFF';
      } else {
        box.className  = 'status err';
        icon.className = 'led-indicator';
        text.textContent = state;
      }
    }

    async function toggleLED() {
      const token = document.getElementById('pat').value.trim();
      if (!token) { setStatus('PATを入力してください'); return; }

      const btn = document.getElementById('toggleBtn');
      btn.disabled = true;
      btn.textContent = '処理中...';

      const headers = {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github+json'
      };

      try {
        // 現在のファイルを取得
        const getRes = await fetch(API, { headers });

        let currentLed = false;
        let sha = null;

        if (getRes.ok) {
          const data = await getRes.json();
          sha = data.sha;
          const decoded = JSON.parse(atob(data.content.replace(/\n/g, '')));
          currentLed = decoded.api_led;
        } else if (getRes.status !== 404) {
          throw new Error(`取得失敗: ${getRes.status}`);
        }

        // 値を反転して書き込み
        const newLed = !currentLed;
        const payload = {
          api_led: newLed,
          timestamp: new Date().toISOString()
        };

        const body = {
          message: `toggle api_led: ${newLed}`,
          content: btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))))
        };
        if (sha) body.sha = sha;

        const putRes = await fetch(API, {
          method: 'PUT',
          headers: { ...headers, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (!putRes.ok) throw new Error(`書き込み失敗: ${putRes.status}`);

        setStatus(newLed ? 'on' : 'off');
      } catch (e) {
        setStatus(`エラー: ${e.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = 'API LED を切り替え';
      }
    }
  </script>
</body>
</html>
