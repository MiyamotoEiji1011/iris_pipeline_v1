<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Iris Pipeline - LED Test</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 480px;
      margin: 60px auto;
      padding: 0 20px;
      background: #f5f5f5;
    }
    h1 { font-size: 1.4rem; color: #333; }
    .card {
      background: white;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      margin-bottom: 16px;
    }
    h2 { font-size: 1rem; color: #444; margin: 0 0 16px; }
    label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 4px; }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      font-size: 0.95rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #4a90d9;
      color: white;
    }
    button:hover { background: #357abd; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    button.green { background: #28a745; }
    button.green:hover { background: #218838; }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 4px;
      font-size: 0.95rem;
      text-align: center;
      display: none;
    }
    .status.on  { background: #d4edda; color: #155724; display: block; }
    .status.off { background: #f8d7da; color: #721c24; display: block; }
    .status.err { background: #fff3cd; color: #856404; display: block; }
    .status.ok  { background: #d4edda; color: #155724; display: block; }
    .led-indicator {
      width: 24px; height: 24px;
      border-radius: 50%;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
      background: #ccc;
    }
    .led-indicator.on  { background: #28a745; box-shadow: 0 0 8px #28a745; }
    .led-indicator.off { background: #dc3545; }
  </style>
</head>
<body>
  <h1>Iris Pipeline</h1>

  <!-- PAT 入力（共通） -->
  <div class="card">
    <label for="pat">GitHub Personal Access Token</label>
    <input type="text" id="pat" placeholder="ghp_xxxxxxxxxxxx">
  </div>

  <!-- LED 制御 -->
  <div class="card">
    <h2>API LED 制御</h2>
    <button id="toggleBtn" onclick="toggleLED()">API LED を切り替え</button>
    <div class="status" id="ledStatus">
      <span class="led-indicator" id="ledIcon"></span>
      <span id="ledStatusText">-</span>
    </div>
  </div>

  <!-- データダウンロード -->
  <div class="card">
    <h2>データダウンロード</h2>
    <button class="green" id="downloadBtn" onclick="downloadCSV()">sample.csv をダウンロード</button>
    <div class="status" id="dlStatus"></div>
  </div>

  <script>
    const OWNER = 'MiyamotoEiji1011';
    const REPO  = 'iris_pipeline_v1';

    function getToken() {
      return document.getElementById('pat').value.trim();
    }

    function githubHeaders() {
      return {
        'Authorization': `Bearer ${getToken()}`,
        'Accept': 'application/vnd.github+json'
      };
    }

    // --- LED 制御 ---
    function setLedStatus(state) {
      const box  = document.getElementById('ledStatus');
      const icon = document.getElementById('ledIcon');
      const text = document.getElementById('ledStatusText');
      if (state === 'on') {
        box.className = 'status on'; icon.className = 'led-indicator on';
        text.textContent = 'API LED: ON';
      } else if (state === 'off') {
        box.className = 'status off'; icon.className = 'led-indicator off';
        text.textContent = 'API LED: OFF';
      } else {
        box.className = 'status err'; icon.className = 'led-indicator';
        text.textContent = state;
      }
    }

    async function toggleLED() {
      if (!getToken()) { setLedStatus('PATを入力してください'); return; }
      const btn = document.getElementById('toggleBtn');
      btn.disabled = true; btn.textContent = '処理中...';

      const api = `https://api.github.com/repos/${OWNER}/${REPO}/contents/api/command.json`;
      try {
        const getRes = await fetch(api, { headers: githubHeaders() });
        let currentLed = false, sha = null;
        if (getRes.ok) {
          const data = await getRes.json();
          sha = data.sha;
          currentLed = JSON.parse(atob(data.content.replace(/\n/g, ''))).api_led;
        } else if (getRes.status !== 404) {
          throw new Error(`取得失敗: ${getRes.status}`);
        }

        const newLed = !currentLed;
        const body = {
          message: `toggle api_led: ${newLed}`,
          content: btoa(unescape(encodeURIComponent(JSON.stringify({ api_led: newLed, timestamp: new Date().toISOString() }, null, 2))))
        };
        if (sha) body.sha = sha;

        const putRes = await fetch(api, {
          method: 'PUT',
          headers: { ...githubHeaders(), 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!putRes.ok) throw new Error(`書き込み失敗: ${putRes.status}`);
        setLedStatus(newLed ? 'on' : 'off');
      } catch (e) {
        setLedStatus(`エラー: ${e.message}`);
      } finally {
        btn.disabled = false; btn.textContent = 'API LED を切り替え';
      }
    }

    // --- CSV ダウンロード ---
    function setDlStatus(type, msg) {
      const box = document.getElementById('dlStatus');
      box.className = `status ${type}`;
      box.textContent = msg;
    }

    async function downloadCSV() {
      if (!getToken()) { setDlStatus('err', 'PATを入力してください'); return; }
      const btn = document.getElementById('downloadBtn');
      btn.disabled = true; btn.textContent = '取得中...';

      const api = `https://api.github.com/repos/${OWNER}/${REPO}/contents/data/sample.csv`;
      try {
        const res = await fetch(api, { headers: githubHeaders() });
        if (!res.ok) throw new Error(`取得失敗: ${res.status}`);

        const data = await res.json();
        const csvText = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));

        // ブラウザでダウンロード
        const blob = new Blob([csvText], { type: 'text/csv' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href     = url;
        a.download = 'sample.csv';
        a.click();
        URL.revokeObjectURL(url);

        setDlStatus('ok', 'ダウンロード完了');
      } catch (e) {
        setDlStatus('err', `エラー: ${e.message}`);
      } finally {
        btn.disabled = false; btn.textContent = 'sample.csv をダウンロード';
      }
    }
  </script>
</body>
</html>
